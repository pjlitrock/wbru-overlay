<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vertical WBRU360 Now Playing Overlay</title>
<link rel="stylesheet" href="shared/overlay-base.css">
<link rel="stylesheet" href="shared/vertical.css">
</head>
<body>

<div id="debug">
  <div id="debug-title"></div>
  <div id="debug-log"></div>
</div>

<div id="lower-block">
  <div id="artwork-block">
    <div id="artwork-placeholder">
      <svg width="80" height="80" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
        <path d="M9 18V5l12-2v13M9 18c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-2c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2z"/>
      </svg>
    </div>
    <img id="artwork-img" alt="Album Art" />
  </div>

  <div id="metadata-block">
    <div class="meta-inner">
      <div id="meta-song" class="meta-shadow"></div>
      <div id="meta-artist-row" class="meta-shadow">
        <span id="meta-artist"></span>
        <span id="meta-concert"></span>
      </div>
      <div id="meta-album-row" class="meta-shadow">
        <span id="meta-album"></span>
        <span id="meta-release"></span>
      </div>
    </div>
  </div>
</div>

<script>
  // ── THIS STATION'S CONFIG ──────────────────────────────
  window.OVERLAY_CONFIG = {
    stationId:      's4d09e922b',
    debug:          false,
    debugTitle:     'VERTICAL WBRU360 OVERLAY — DIAGNOSTIC LOG (newest first)',

    albumsCsvUrl:   'https://docs.google.com/spreadsheets/d/e/2PACX-1vQOWhnzYjSHDGH9_sVF6NiKduAUhAFkEYtWn4FOId6DmU5dIhzbXaQUNQv_toFhuJrGchvkPbhVWkM-/pub?gid=0&single=true&output=csv',
    concertsCsvUrl: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSuuWfJqxFUDSDlqFKVrW4cyariFSECCAwZ-qTrDm8lDP20mi1Ulr_VJ3pw35ZbUYnMuHtLZWSClEm8/pub?gid=0&single=true&output=csv'

    // Optional overrides (defaults shown):
    // pollIntervalMs: 12000,
    // v2MatchRetries: 4,
    // v2RetryDelayMs: 4000,
    // fadeDurationMs: 600
  };
</script>
<script src="shared/overlay-engine.js"></script>
</body>
</html>
